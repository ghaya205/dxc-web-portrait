services:
  db:
    image: mysql:8.0
    container_name: dxc_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dxcdb
      MYSQL_USER: dxcuser
      MYSQL_PASSWORD: dxcpass
    ports:
      - "3307:3306"
    volumes:
      - dxc_db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: dxc_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: dxcdb
      DB_USER: dxcuser
      DB_PASS: dxcpass
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html/backend
      - ./vendor:/var/www/html/vendor
      - ./.env:/var/www/html/.env

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: dxc_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8091:80"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: dxc_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpass
    ports:
      - "8082:80"

volumes:
  dxc_db_data:
